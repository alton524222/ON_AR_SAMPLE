<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>ARフォトフレーム</title>

<style>

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:sans-serif;
}

#video{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#scanCanvas,
#photoCanvas{
  display:none;
}

#arImage{
  position:fixed;
  display:none;
  z-index:5;
  pointer-events:none;
  transform-origin:center center;
  user-select:none;
  -webkit-user-drag:none;
}

#msg{
  position:fixed;
  z-index:20;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  background:rgba(0,0,0,.75);
  padding:9px 16px;
  border-radius:20px;
  font-size:14px;
  white-space:nowrap;
  text-align:center;
}

#capture{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  width:78px;
  height:78px;
  border-radius:50%;
  border:6px solid #fff;
  background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.6);
  display:none;
  padding:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

#capture::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#222;
}

#save{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:125px;
  transform:translateX(-50%);
  display:none;
  padding:12px 22px;
  border-radius:22px;
  background:#fff;
  color:#111;
  text-decoration:none;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 2px 12px rgba(0,0,0,.6);
  white-space:nowrap;
}

#flash{
  position:fixed;
  inset:0;
  z-index:100;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#start{
  position:fixed;
  z-index:40;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  padding:15px 28px;
  border:0;
  border-radius:25px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 2px 12px rgba(0,0,0,.6);
}

</style>
</head>

<body>

<video
  id="video"
  autoplay
  playsinline
  muted
></video>

<canvas id="scanCanvas"></canvas>

<canvas id="photoCanvas"></canvas>

<!--
  AR画像はJavaScriptで切り替える
-->
<img
  id="arImage"
  src=""
  alt=""
>

<div id="msg">
  カメラを開始してください
</div>

<button id="start">
  カメラを開始
</button>

<button
  id="capture"
  aria-label="撮影"
></button>

<a
  id="save"
  download="AR_photo.jpg"
>
  写真を保存
</a>

<div id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>

/* ==================================================
   DOM
================================================== */

const video =
  document.getElementById("video");

const scanCanvas =
  document.getElementById("scanCanvas");

const scanCtx =
  scanCanvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const photoCanvas =
  document.getElementById("photoCanvas");

const photoCtx =
  photoCanvas.getContext("2d");

const arImage =
  document.getElementById("arImage");

const msg =
  document.getElementById("msg");

const startButton =
  document.getElementById("start");

const captureButton =
  document.getElementById("capture");

const saveButton =
  document.getElementById("save");

const flash =
  document.getElementById("flash");


/* ==================================================
   QRコードと画像の対応表
================================================== */

/*
 * QRコードのデータ
 *       ↓
 * 表示する画像
 */

const AR_IMAGES = {

  "OTOKKY_AR_001":
    "otokkky.png",

  "HZK_AR":
    "HZK.PNG"

};


/*
 * 現在表示している画像
 */

let currentImageSrc = "";


/* ==================================================
   AR設定
================================================== */

const AR_WIDTH_SCALE = 8;

const AR_OFFSET_Y_SCALE = 6;

const JPEG_QUALITY = 0.95;


/* ==================================================
   状態
================================================== */

let stream = null;

let running = false;

let currentAR = null;

let arImageReady = false;


/* ==================================================
   画像読み込み
================================================== */

arImage.onload =
  function(){

    arImageReady = true;

  };


arImage.onerror =
  function(){

    arImageReady = false;

    console.error(
      "AR画像を読み込めません:",
      arImage.src
    );

  };


/* ==================================================
   指定画像を読み込む
================================================== */

function loadARImage(src){

  /*
   * すでに同じ画像なら
   * 読み込み直し不要
   */

  if(currentImageSrc === src){

    if(arImage.complete &&
       arImage.naturalWidth > 0){

      arImageReady = true;

    }

    return;

  }


  /*
   * 読み込み状態をリセット
   */

  arImageReady = false;

  currentImageSrc = src;


  /*
   * 画像変更
   */

  arImage.src = src;

}


/* ==================================================
   カメラ開始
================================================== */

startButton.onclick =
  async function(){

    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }
          },

          audio:false

        });


      video.srcObject =
        stream;

      await video.play();


      startButton.style.display =
        "none";


      msg.textContent =
        "QRコードを探しています…";


      running = true;


      requestAnimationFrame(scan);


    }catch(error){

      console.error(error);

      msg.textContent =
        "カメラを使用できません。HTTPS接続とカメラ許可を確認してください。";

    }

  };


/* ==================================================
   QR認識
================================================== */

function scan(){

  if(!running){

    return;

  }


  if(
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ){

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    scanCanvas.width =
      w;

    scanCanvas.height =
      h;


    /*
     * カメラ映像をCanvasへ
     */

    scanCtx.drawImage(
      video,
      0,
      0,
      w,
      h
    );


    const imageData =
      scanCtx.getImageData(
        0,
        0,
        w,
        h
      );


    /*
     * QR認識
     */

    const qr =
      jsQR(
        imageData.data,
        w,
        h,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    /*
     * QRが存在する
     */

    if(
      qr &&
      qr.location
    ){

      /*
       * QRデータに対応する画像を取得
       */

      const imageSrc =
        AR_IMAGES[qr.data];


      /*
       * 登録されているQRなら
       * AR表示
       */

      if(imageSrc){

        /*
         * 対応画像を読み込む
         */

        loadARImage(
          imageSrc
        );


        /*
         * QR位置からAR位置を計算
         */

        updateAR(
          qr.location
        );


        /*
         * メッセージ
         */

        msg.textContent =
          qr.data === "HZK＿AR"
            ? "HZK AR表示中"
            : "おとっきー AR表示中";


      }else{

        /*
         * 登録されていないQR
         */

        hideAR();

      }

    }else{

      /*
       * QRなし
       */

      hideAR();

    }

  }


  requestAnimationFrame(scan);

}


/* ==================================================
   AR位置計算
================================================== */

function updateAR(location){

  const tl =
    location.topLeftCorner;

  const tr =
    location.topRightCorner;

  const bl =
    location.bottomLeftCorner;

  const br =
    location.bottomRightCorner;


  /*
   * QR中心
   */

  const cx =
    (
      tl.x +
      tr.x +
      bl.x +
      br.x
    ) / 4;


  const cy =
    (
      tl.y +
      tr.y +
      bl.y +
      br.y
    ) / 4;


  /*
   * QR幅
   */

  const qw =
    Math.hypot(
      tr.x - tl.x,
      tr.y - tl.y
    );


  /*
   * QR高さ
   */

  const qh =
    Math.hypot(
      bl.x - tl.x,
      bl.y - tl.y
    );


  /*
   * QR角度
   */

  const angle =
    Math.atan2(
      tr.y - tl.y,
      tr.x - tl.x
    );


  /*
   * AR位置
   */

  const arX =
    cx;


  const arY =
    cy -
    qh * AR_OFFSET_Y_SCALE;


  /*
   * AR情報
   *
   * すべてカメラ映像座標
   */

  currentAR = {

    x:arX,

    y:arY,

    width:
      qw * AR_WIDTH_SCALE,

    angle:angle,

    cameraWidth:
      video.videoWidth,

    cameraHeight:
      video.videoHeight

  };


  /*
   * 画面へ表示
   */

  renderAROnScreen();


  /*
   * 撮影ボタン表示
   *
   * 画像読み込み中でも表示しておく
   */

  captureButton.style.display =
    "block";

}


/* ==================================================
   画面上のAR表示
================================================== */

function renderAROnScreen(){

  if(!currentAR){

    return;

  }


  /*
   * 画像がまだ読み込まれていなければ
   * 表示しない
   */

  if(
    !arImageReady ||
    arImage.naturalWidth <= 0
  ){

    arImage.style.display =
      "none";

    return;

  }


  const vw =
    currentAR.cameraWidth;

  const vh =
    currentAR.cameraHeight;


  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  /*
   * object-fit:coverと
   * 同じ倍率
   */

  const scale =
    Math.max(
      sw / vw,
      sh / vh
    );


  const displayWidth =
    vw * scale;

  const displayHeight =
    vh * scale;


  const offsetX =
    (sw - displayWidth) / 2;


  const offsetY =
    (sh - displayHeight) / 2;


  /*
   * カメラ座標
   * ↓
   * 画面座標
   */

  const screenX =
    offsetX +
    currentAR.x * scale;


  const screenY =
    offsetY +
    currentAR.y * scale;


  const screenWidth =
    currentAR.width * scale;


  const aspect =
    arImage.naturalHeight /
    arImage.naturalWidth;


  const screenHeight =
    screenWidth * aspect;


  /*
   * AR画像表示
   */

  arImage.style.display =
    "block";


  arImage.style.width =
    screenWidth + "px";


  arImage.style.height =
    screenHeight + "px";


  arImage.style.left =
    screenX + "px";


  arImage.style.top =
    screenY + "px";


  arImage.style.transform =
    "translate(-50%,-50%) rotate(" +
    currentAR.angle *
    180 / Math.PI +
    "deg)";

}


/* ==================================================
   AR非表示
================================================== */

function hideAR(){

  arImage.style.display =
    "none";

  currentAR =
    null;

  captureButton.style.display =
    "none";

  saveButton.style.display =
    "none";

}


/* ==================================================
   画面サイズ変更
================================================== */

window.addEventListener(
  "resize",
  function(){

    if(currentAR){

      renderAROnScreen();

    }

  }
);


/* ==================================================
   撮影
================================================== */

captureButton.onclick =
  function(){

    /*
     * AR情報確認
     */

    if(!currentAR){

      msg.textContent =
        "QRコードを認識してください";

      return;

    }


    /*
     * 画像読み込み確認
     */

    if(
      !arImageReady ||
      !arImage.complete ||
      arImage.naturalWidth <= 0
    ){

      msg.textContent =
        "AR画像を読み込んでいます…";

      return;

    }


    /*
     * カメラ映像サイズ
     */

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    /*
     * 撮影Canvas
     */

    photoCanvas.width =
      w;

    photoCanvas.height =
      h;


    /*
     * カメラ映像
     */

    photoCtx.clearRect(
      0,
      0,
      w,
      h
    );


    photoCtx.drawImage(
      video,
      0,
      0,
      w,
      h
    );


    /*
     * AR画像高さ
     */

    const arHeight =
      currentAR.width *
      (
        arImage.naturalHeight /
        arImage.naturalWidth
      );


    /*
     * AR画像合成
     */

    photoCtx.save();


    photoCtx.translate(
      currentAR.x,
      currentAR.y
    );


    photoCtx.rotate(
      currentAR.angle
    );


    photoCtx.drawImage(

      arImage,

      -currentAR.width / 2,

      -arHeight / 2,

      currentAR.width,

      arHeight

    );


    photoCtx.restore();


    /*
     * フラッシュ
     */

    flash.style.opacity =
      "1";


    setTimeout(
      function(){

        flash.style.opacity =
          "0";

      },
      100
    );


    /*
     * JPEG作成
     */

    photoCanvas.toBlob(

      function(blob){

        if(!blob){

          msg.textContent =
            "写真を作成できませんでした";

          return;

        }


        /*
         * 古いURLを解放
         */

        if(
          saveButton.dataset.url
        ){

          URL.revokeObjectURL(
            saveButton.dataset.url
          );

        }


        /*
         * Blob URL
         */

        const url =
          URL.createObjectURL(
            blob
          );


        saveButton.href =
          url;


        saveButton.dataset.url =
          url;


        /*
         * ファイル名
         */

        const now =
          new Date();


        const filename =
          "AR_" +

          now.getFullYear() +

          String(
            now.getMonth()+1
          ).padStart(2,"0") +

          String(
            now.getDate()
          ).padStart(2,"0") +

          "_" +

          String(
            now.getHours()
          ).padStart(2,"0") +

          String(
            now.getMinutes()
          ).padStart(2,"0") +

          String(
            now.getSeconds()
          ).padStart(2,"0") +

          ".jpg";


        saveButton.download =
          filename;


        /*
         * 保存ボタン
         */

        saveButton.style.display =
          "block";


        msg.textContent =
          "撮影しました！";


      },

      "image/jpeg",

      JPEG_QUALITY

    );

  };


/* ==================================================
   終了処理
================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(stream){

      stream
        .getTracks()
        .forEach(
          function(track){

            track.stop();

          }
        );

    }


    if(
      saveButton.dataset.url
    ){

      URL.revokeObjectURL(
        saveButton.dataset.url
      );

    }

  }
);

</script>

</body>
</html>

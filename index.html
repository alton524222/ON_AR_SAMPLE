<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>おとっきー AR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#scan{display:none}
#message{position:fixed;z-index:5;top:12px;left:12px;right:12px;padding:12px;
 background:rgba(0,0,0,.65);color:#fff;text-align:center;border-radius:12px}
#arText{position:fixed;z-index:4;display:none;transform-origin:center;
 color:#ffd83d;font-weight:900;font-size:clamp(28px,10vw,80px);
 -webkit-text-stroke:clamp(2px,.7vw,6px) white;
 text-shadow:0 5px 10px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none}
#start{position:fixed;z-index:10;left:20px;right:20px;bottom:28px;padding:16px;border:0;border-radius:14px;
font-size:18px;font-weight:700}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="scan"></canvas>
<div id="message">「カメラを開始」を押してカードを映してください</div>
<div id="arText">おとっきー</div>
<button id="start">カメラを開始</button>

<!-- 無料のQR認識ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const video=document.getElementById("video");
const canvas=document.getElementById("scan");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const arText=document.getElementById("arText");
const msg=document.getElementById("message");
const start=document.getElementById("start");

let stream=null, running=false;

start.onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    start.style.display="none";
    msg.textContent="カードをカメラに映してください";
    running=true;
    requestAnimationFrame(scan);
  }catch(e){
    msg.textContent="カメラを使用できません。HTTPS接続とカメラ許可を確認してください。";
    console.error(e);
  }
};

function scan(){
  if(!running)return;
  if(video.readyState>=2 && video.videoWidth){
    // 処理サイズを小さくしてスマホでも軽くする
    const w=480;
    const h=Math.round(video.videoHeight/video.videoWidth*w);
    canvas.width=w; canvas.height=h;
    ctx.drawImage(video,0,0,w,h);
    const image=ctx.getImageData(0,0,w,h);
    const code=jsQR(image.data,w,h,{inversionAttempts:"dontInvert"});

    if(code){
      msg.textContent="カードを認識しました！";
      positionAR(code.location);
      arText.style.display="block";
    }else{
      msg.textContent="カードをカメラに映してください";
      arText.style.display="none";
    }
  }
  requestAnimationFrame(scan);
}

function positionAR(loc){
  // QRの4隅を使って中心・角度・大きさを求める
  const tl=loc.topLeftCorner, tr=loc.topRightCorner;
  const br=loc.bottomRightCorner, bl=loc.bottomLeftCorner;
  const cx=(tl.x+tr.x+br.x+bl.x)/4;
  const cy=(tl.y+tr.y+br.y+bl.y)/4;
  const dx=tr.x-tl.x, dy=tr.y-tl.y;
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  const size=Math.hypot(dx,dy);

  // canvas座標 → 画面座標
  const sx=innerWidth/canvas.width, sy=innerHeight/canvas.height;
  arText.style.left=(cx*sx)+"px";
  // QRの少し上に表示
  arText.style.top=(cy*sy-size*0.75*sy)+"px";
  arText.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
  arText.style.fontSize=Math.max(28,Math.min(80,size*sx*0.42))+"px";
}
</script>
</body>
</html>

<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>おとっきー AR</title>

<style>

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:sans-serif;
}

#video{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
}

#canvas{
  display:none;
}

#arImage{
  position:fixed;

  display:none;

  z-index:5;

  pointer-events:none;

  transform-origin:center center;

  max-width:none;
  max-height:none;
}

#msg{
  position:fixed;

  top:14px;
  left:50%;

  transform:translateX(-50%);

  z-index:20;

  color:#fff;

  background:rgba(0,0,0,.75);

  padding:9px 14px;

  border-radius:20px;

  font-size:14px;

  white-space:nowrap;
}

#capture{
  position:fixed;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  z-index:20;

  display:none;

  width:70px;
  height:70px;

  border-radius:50%;

  border:5px solid white;

  background:#222;

  color:white;

  font-size:20px;
}

#save{
  position:fixed;

  left:50%;
  bottom:110px;

  transform:translateX(-50%);

  z-index:20;

  display:none;

  padding:12px 20px;

  border-radius:20px;

  background:white;

  color:#111;

  text-decoration:none;

  font-weight:bold;
}

#flash{
  position:fixed;

  inset:0;

  z-index:100;

  background:white;

  opacity:0;

  pointer-events:none;
}

</style>

</head>


<body>


<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<canvas id="canvas"></canvas>


<img
  id="arImage"
  src=""
  alt=""
>


<div id="msg">
  QRコードをカメラに映してください
</div>


<button id="capture">
  ●
</button>


<a
  id="save"
  download="AR_photo.jpg"
>
  写真を保存
</a>


<div id="flash"></div>


<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<script>

/* ==================================================
   DOM
================================================== */

const v =
  document.getElementById("video");

const c =
  document.getElementById("canvas");

const x =
  c.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const im =
  document.getElementById("arImage");

const m =
  document.getElementById("msg");

const capture =
  document.getElementById("capture");

const save =
  document.getElementById("save");

const flash =
  document.getElementById("flash");


/* ==================================================
   QR → AR画像
================================================== */

const AR_IMAGES = {

  "OTOKKY_AR_001":
    "otokkky.png",

  "HZK＿AR":
    "HZK.PNG"

};


/* ==================================================
   現在の状態
================================================== */

let currentQR = "";

let currentImageFile = "";

let currentLocation = null;

let imageLoaded = false;


/* ==================================================
   AR設定
================================================== */

const IMAGE_SCALE = 8;

const IMAGE_OFFSET = 6;


/* ==================================================
   カメラ開始
================================================== */

async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    v.srcObject =
      stream;

    await v.play();


    m.textContent =
      "QRコードを探しています…";


    requestAnimationFrame(
      scan
    );


  }catch(e){

    console.error(e);

    m.textContent =
      "カメラを使用できません。HTTPS接続とカメラ許可を確認してください。";

  }

}


/* ==================================================
   AR画像を変更
================================================== */

function setARImage(file){

  /*
   * 同じ画像なら変更しない
   */

  if(
    currentImageFile === file
  ){

    return;

  }


  /*
   * 新しい画像
   */

  currentImageFile =
    file;

  imageLoaded =
    false;


  /*
   * いったん非表示
   */

  im.style.display =
    "none";


  /*
   * キャッシュ対策として
   * srcを設定
   */

  im.src =
    file;


  console.log(
    "AR画像変更:",
    file
  );

}


/* ==================================================
   画像読み込み完了
================================================== */

im.onload =
  function(){

    imageLoaded =
      true;


    console.log(
      "AR画像読み込み完了:",
      im.src,

      "幅:",
      im.naturalWidth,

      "高さ:",
      im.naturalHeight
    );


    /*
     * 現在QRが認識されていれば
     * 直ちに再表示
     */

    if(
      currentLocation
    ){

      positionAR(
        currentLocation
      );

    }

  };


/* ==================================================
   画像読み込み失敗
================================================== */

im.onerror =
  function(){

    imageLoaded =
      false;

    console.error(
      "AR画像の読み込みに失敗:",
      im.src
    );

    m.textContent =
      "AR画像を読み込めません";

  };


/* ==================================================
   QRスキャン
================================================== */

function scan(){

  if(
    v.readyState >= 2 &&
    v.videoWidth > 0
  ){

    /*
     * QR認識用画像サイズ
     */

    const w =
      1920;

    const h =
      Math.round(
        w *
        v.videoHeight /
        v.videoWidth
      );


    c.width =
      w;

    c.height =
      h;


    /*
     * カメラ映像
     */

    x.drawImage(
      v,
      0,
      0,
      w,
      h
    );


    /*
     * ピクセル取得
     */

    const data =
      x.getImageData(
        0,
        0,
        w,
        h
      );


    /*
     * QR認識
     */

    const qr =
      jsQR(
        data.data,
        w,
        h,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    /* ==============================================
       QRあり
    ============================================== */

    if(
      qr &&
      qr.location
    ){

      const file =
        AR_IMAGES[
          qr.data
        ];


      /*
       * 登録されたQR
       */

      if(file){

        currentQR =
          qr.data;

        currentLocation =
          qr.location;


        /*
         * AR画像を指定
         */

        setARImage(
          file
        );


        /*
         * AR位置
         */

        positionAR(
          qr.location
        );


        /*
         * メッセージ
         */

        if(
          qr.data ===
          "OTOKKY_AR_001"
        ){

          m.textContent =
            "おとっきーAR表示中";

        }else if(
          qr.data ===
          "HZK＿AR"
        ){

          m.textContent =
            "HZK AR表示中";

        }


        capture.style.display =
          "block";


      }else{

        hideAR();

      }

    }else{

      hideAR();

    }

  }


  requestAnimationFrame(
    scan
  );

}


/* ==================================================
   AR位置計算
================================================== */

function positionAR(loc){

  /*
   * 画像がまだ読み込まれていない
   * 場合は位置だけ保存
   */

  currentLocation =
    loc;


  if(
    !imageLoaded
  ){

    return;

  }


  const tl =
    loc.topLeftCorner;

  const tr =
    loc.topRightCorner;

  const bl =
    loc.bottomLeftCorner;

  const br =
    loc.bottomRightCorner;


  /*
   * QR中心
   */

  const cx =
    (
      tl.x +
      tr.x +
      bl.x +
      br.x
    ) / 4;


  const cy =
    (
      tl.y +
      tr.y +
      bl.y +
      br.y
    ) / 4;


  /*
   * QR幅
   */

  const qw =
    Math.hypot(
      tr.x - tl.x,
      tr.y - tl.y
    );


  /*
   * QR高さ
   */

  const qh =
    Math.hypot(
      bl.x - tl.x,
      bl.y - tl.y
    );


  /*
   * QR角度
   */

  const angle =
    Math.atan2(
      tr.y - tl.y,
      tr.x - tl.x
    ) *
    180 /
    Math.PI;


  /*
   * カメラ座標
   */

  const arX =
    cx;

  const arY =
    cy -
    qh * IMAGE_OFFSET;


  /*
   * object-fit:cover
   * と同じ表示倍率を計算
   */

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  const cameraWidth =
    v.videoWidth;

  const cameraHeight =
    v.videoHeight;


  const scale =
    Math.max(
      screenWidth /
        cameraWidth,

      screenHeight /
        cameraHeight
    );


  /*
   * 実際に画面へ表示される
   * カメラ映像サイズ
   */

  const displayedWidth =
    cameraWidth *
    scale;

  const displayedHeight =
    cameraHeight *
    scale;


  /*
   * object-fit:coverによる
   * クロップ量
   */

  const offsetX =
    (
      screenWidth -
      displayedWidth
    ) / 2;


  const offsetY =
    (
      screenHeight -
      displayedHeight
    ) / 2;


  /*
   * カメラ座標
   * ↓
   * 画面座標
   */

  const screenX =
    offsetX +
    arX *
    scale;


  const screenY =
    offsetY +
    arY *
    scale;


  /*
   * AR画像サイズ
   */

  const width =
    qw *
    IMAGE_SCALE *
    scale;


  /*
   * 表示
   */

  im.style.width =
    width + "px";

  im.style.height =
    "auto";

  im.style.left =
    screenX + "px";

  im.style.top =
    screenY + "px";


  im.style.transform =
    "translate(-50%,-50%) rotate(" +
    angle +
    "deg)";


  im.style.display =
    "block";

}


/* ==================================================
   AR非表示
================================================== */

function hideAR(){

  im.style.display =
    "none";

  capture.style.display =
    "none";

  save.style.display =
    "none";

  currentQR =
    "";

  currentLocation =
    null;

}


/* ==================================================
   画面サイズ変更
================================================== */

window.addEventListener(
  "resize",
  function(){

    if(
      currentLocation
    ){

      positionAR(
        currentLocation
      );

    }

  }
);


/* ==================================================
   撮影
================================================== */

capture.onclick =
  function(){

    if(
      !currentLocation ||
      !imageLoaded
    ){

      return;

    }


    /*
     * 撮影Canvas
     */

    const photo =
      document.createElement(
        "canvas"
      );


    const pc =
      photo.getContext("2d");


    const w =
      v.videoWidth;

    const h =
      v.videoHeight;


    photo.width =
      w;

    photo.height =
      h;


    /*
     * カメラ映像
     */

    pc.drawImage(
      v,
      0,
      0,
      w,
      h
    );


    /*
     * QR位置
     */

    const loc =
      currentLocation;


    const tl =
      loc.topLeftCorner;

    const tr =
      loc.topRightCorner;

    const bl =
      loc.bottomLeftCorner;

    const br =
      loc.bottomRightCorner;


    const cx =
      (
        tl.x +
        tr.x +
        bl.x +
        br.x
      ) / 4;


    const cy =
      (
        tl.y +
        tr.y +
        bl.y +
        br.y
      ) / 4;


    const qw =
      Math.hypot(
        tr.x - tl.x,
        tr.y - tl.y
      );


    const qh =
      Math.hypot(
        bl.x - tl.x,
        bl.y - tl.y
      );


    const angle =
      Math.atan2(
        tr.y - tl.y,
        tr.x - tl.x
      );


    /*
     * ARサイズ
     */

    const arWidth =
      qw *
      IMAGE_SCALE;


    const arHeight =
      arWidth *
      im.naturalHeight /
      im.naturalWidth;


    /*
     * AR位置
     */

    const arX =
      cx;


    const arY =
      cy -
      qh *
      IMAGE_OFFSET;


    /*
     * 合成
     */

    pc.save();


    pc.translate(
      arX,
      arY
    );


    pc.rotate(
      angle
    );


    pc.drawImage(

      im,

      -arWidth / 2,

      -arHeight / 2,

      arWidth,

      arHeight

    );


    pc.restore();


    /*
     * フラッシュ
     */

    flash.style.opacity =
      "1";


    setTimeout(
      function(){

        flash.style.opacity =
          "0";

      },
      100
    );


    /*
     * 保存
     */

    photo.toBlob(

      function(blob){

        if(!blob){

          return;

        }


        const url =
          URL.createObjectURL(
            blob
          );


        save.href =
          url;


        save.download =
          "AR_" +
          currentQR +
          ".jpg";


        save.style.display =
          "block";


        m.textContent =
          "撮影しました！";

      },

      "image/jpeg",

      0.95

    );

  };


/* ==================================================
   起動
================================================== */

startCamera();

</script>

</body>
</html>

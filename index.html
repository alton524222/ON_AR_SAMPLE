<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>おとっきー AR</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:sans-serif}#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#canvas{display:none}#arImage{position:fixed;display:none;pointer-events:none;z-index:5;transform-origin:center center}#msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;color:#fff;background:#000b;padding:9px 14px;border-radius:20px;font-size:14px;white-space:nowrap}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><img id="arImage" src="otokkky.png"><div id="msg">QRコードをカメラに映してください</div><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>const v=document.getElementById('video'),c=document.getElementById('canvas'),x=c.getContext('2d',{willReadFrequently:true}),im=document.getElementById('arImage'),m=document.getElementById('msg');async function start(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=s;await v.play();m.textContent='QRコードを探しています…';requestAnimationFrame(scan)}catch(e){m.textContent='カメラを使用できません。HTTPS接続とカメラ許可を確認してください。'}}function scan(){if(v.readyState>=2){const w=480,h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);const d=x.getImageData(0,0,w,h),q=jsQR(d.data,w,h,{inversionAttempts:'dontInvert'});if(q&&q.location && q.data === "OTOKKY_AR_001"){const p=q.location,tl=p.topLeftCorner,tr=p.topRightCorner,bl=p.bottomLeftCorner,br=p.bottomRightCorner;const cx=(tl.x+tr.x+bl.x+br.x)/4,cy=(tl.y+tr.y+bl.y+br.y)/4,qw=Math.hypot(tr.x-tl.x,tr.y-tl.y),qh=Math.hypot(bl.x-tl.x,bl.y-tl.y),ang=Math.atan2(tr.y-tl.y,tr.x-tl.x)*180/Math.PI,sx=innerWidth/w,sy=innerHeight/h;im.style.display='block';im.style.width=(qw*sx*4)+'px';im.style.left=(cx*sx)+'px';im.style.top=(cy*sy-qh*0.95*sy)+'px';im.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;m.textContent='AR表示中'}else{im.style.display='none';m.textContent='QRコードを探しています…'}}requestAnimationFrame(scan)}start();</script></body></html>

<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>おとっきー AR</title>

<style>

/* ================================
   ページ全体
================================ */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:sans-serif;
}


/* ================================
   カメラ映像
================================ */

#video{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}


/* ================================
   QR認識用Canvas
================================ */

#scanCanvas{
  display:none;
}


/* ================================
   撮影用Canvas
================================ */

#photoCanvas{
  display:none;
}


/* ================================
   AR画像
================================ */

#arImage{

  position:fixed;

  display:none;

  pointer-events:none;

  z-index:5;

  transform-origin:center center;

  user-select:none;

  -webkit-user-drag:none;
}


/* ================================
   メッセージ
================================ */

#msg{

  position:fixed;

  top:14px;
  left:50%;

  transform:translateX(-50%);

  z-index:20;

  color:#fff;

  background:rgba(0,0,0,.75);

  padding:9px 16px;

  border-radius:20px;

  font-size:14px;

  white-space:nowrap;

  max-width:90%;

  box-sizing:border-box;

  text-align:center;
}


/* ================================
   撮影ボタン
================================ */

#capture{

  position:fixed;

  z-index:30;

  left:50%;

  bottom:25px;

  transform:translateX(-50%);

  width:78px;
  height:78px;

  border-radius:50%;

  border:6px solid #fff;

  background:#fff;

  box-shadow:
    0 2px 12px rgba(0,0,0,.6);

  display:none;

  padding:0;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}


/* 撮影ボタン中央 */

#capture::after{

  content:"";

  position:absolute;

  left:50%;
  top:50%;

  width:58px;
  height:58px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#222;
}


/* ================================
   保存ボタン
================================ */

#save{

  position:fixed;

  z-index:30;

  left:50%;

  bottom:125px;

  transform:translateX(-50%);

  display:none;

  padding:12px 22px;

  border-radius:22px;

  background:#fff;

  color:#111;

  text-decoration:none;

  font-size:15px;

  font-weight:bold;

  box-shadow:
    0 2px 12px rgba(0,0,0,.6);

  white-space:nowrap;
}


/* ================================
   撮影フラッシュ
================================ */

#flash{

  position:fixed;

  inset:0;

  z-index:100;

  background:#fff;

  opacity:0;

  pointer-events:none;
}


/* ================================
   カメラ開始ボタン
================================ */

#start{

  position:fixed;

  z-index:40;

  left:50%;

  bottom:30px;

  transform:translateX(-50%);

  padding:15px 28px;

  border:0;

  border-radius:25px;

  background:#fff;

  color:#111;

  font-size:16px;

  font-weight:bold;

  display:block;

  box-shadow:
    0 2px 12px rgba(0,0,0,.6);
}

</style>

</head>


<body>


<!-- ================================
     カメラ
================================ -->

<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<!-- ================================
     QR認識用Canvas
================================ -->

<canvas id="scanCanvas"></canvas>


<!-- ================================
     撮影用Canvas
================================ -->

<canvas id="photoCanvas"></canvas>


<!-- ================================
     ARキャラクター
================================ -->

<img
  id="arImage"
  src="otokkky.png"
  alt=""
>


<!-- ================================
     メッセージ
================================ -->

<div id="msg">
  カメラを開始してください
</div>


<!-- ================================
     カメラ開始
================================ -->

<button id="start">
  カメラを開始
</button>


<!-- ================================
     撮影
================================ -->

<button
  id="capture"
  aria-label="撮影"
></button>


<!-- ================================
     保存
================================ -->

<a
  id="save"
  download="otokkky_AR.jpg"
>
  写真を保存
</a>


<!-- ================================
     フラッシュ
================================ -->

<div id="flash"></div>


<!-- ================================
     QR認識ライブラリ
================================ -->

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<script>

/* ==================================================
   DOM
================================================== */

const video =
  document.getElementById("video");

const scanCanvas =
  document.getElementById("scanCanvas");

const scanCtx =
  scanCanvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const photoCanvas =
  document.getElementById("photoCanvas");

const photoCtx =
  photoCanvas.getContext("2d");

const arImage =
  document.getElementById("arImage");

const msg =
  document.getElementById("msg");

const startButton =
  document.getElementById("start");

const captureButton =
  document.getElementById("capture");

const saveButton =
  document.getElementById("save");

const flash =
  document.getElementById("flash");


/* ==================================================
   設定
================================================== */


/*
 * 認識させるQRコードの内容
 *
 * QRコードには
 *
 * OTOKKY_AR_001
 *
 * と書き込んでください。
 */

const ALLOWED_QR =
  "OTOKKY_AR_001";


/*
 * AR画像の大きさ
 *
 * QRコードの幅 × この倍率
 */

const AR_WIDTH_SCALE =
  8;


/*
 * QRコードから上方向への距離
 *
 * QRコードの高さ × この倍率
 */

const AR_OFFSET_Y_SCALE =
  6;


/*
 * 保存画像のJPEG品質
 */

const JPEG_QUALITY =
  0.95;


/* ==================================================
   状態
================================================== */

let stream = null;

let running = false;


/*
 * 現在認識中のAR情報
 */

let currentAR = null;


/*
 * AR画像が読み込まれたか
 */

let arImageReady = false;


/* ==================================================
   AR画像の読み込み
================================================== */

arImage.onload = function(){

  arImageReady = true;

  console.log(
    "AR画像読み込み完了:",
    arImage.naturalWidth,
    "x",
    arImage.naturalHeight
  );

};


arImage.onerror = function(){

  arImageReady = false;

  msg.textContent =
    "otokkky.pngを読み込めません";

  console.error(
    "otokkky.pngの読み込みに失敗しました"
  );

};


/* ==================================================
   カメラ開始
================================================== */

startButton.onclick =
  async function(){

    try{

      /*
       * カメラ取得
       */

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            /*
             * 高解像度カメラを優先
             */

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }
          },

          audio:false

        });


      /*
       * videoへ接続
       */

      video.srcObject =
        stream;


      await video.play();


      /*
       * 開始ボタンを隠す
       */

      startButton.style.display =
        "none";


      /*
       * 撮影ボタンを隠す
       */

      captureButton.style.display =
        "none";


      /*
       * 保存ボタンを隠す
       */

      saveButton.style.display =
        "none";


      /*
       * 状態
       */

      running = true;


      msg.textContent =
        "QRコードを探しています…";


      /*
       * QR認識開始
       */

      requestAnimationFrame(scan);


    }catch(error){

      console.error(error);

      msg.textContent =
        "カメラを使用できません。HTTPS接続とカメラ許可を確認してください。";

    }

  };


/* ==================================================
   QR認識
================================================== */

function scan(){

  if(!running){

    return;

  }


  /*
   * カメラ映像が利用可能か確認
   */

  if(
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ){

    /*
     * QR認識用画像サイズ
     *
     * 高解像度で認識
     */

    const scanWidth =
      1920;

    const scanHeight =
      Math.round(
        scanWidth *
        video.videoHeight /
        video.videoWidth
      );


    /*
     * Canvasサイズ
     */

    scanCanvas.width =
      scanWidth;

    scanCanvas.height =
      scanHeight;


    /*
     * カメラ映像をCanvasへ
     */

    scanCtx.drawImage(
      video,
      0,
      0,
      scanWidth,
      scanHeight
    );


    /*
     * ピクセル取得
     */

    const imageData =
      scanCtx.getImageData(
        0,
        0,
        scanWidth,
        scanHeight
      );


    /*
     * QR認識
     */

    const qr =
      jsQR(
        imageData.data,
        scanWidth,
        scanHeight,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    /*
     * 特定QRだけを許可
     */

    if(
      qr &&
      qr.location &&
      qr.data === ALLOWED_QR
    ){

      showAR(
        qr.location
      );


    }else{

      hideAR();

    }

  }


  /*
   * 次のフレーム
   */

  requestAnimationFrame(scan);

}


/* ==================================================
   AR表示
================================================== */

function showAR(location){

  /*
   * QRの4隅
   */

  const tl =
    location.topLeftCorner;

  const tr =
    location.topRightCorner;

  const bl =
    location.bottomLeftCorner;

  const br =
    location.bottomRightCorner;


  /*
   * QR中心
   */

  const cx =
    (
      tl.x +
      tr.x +
      bl.x +
      br.x
    ) / 4;


  const cy =
    (
      tl.y +
      tr.y +
      bl.y +
      br.y
    ) / 4;


  /*
   * QR幅
   */

  const qw =
    Math.hypot(
      tr.x - tl.x,
      tr.y - tl.y
    );


  /*
   * QR高さ
   */

  const qh =
    Math.hypot(
      bl.x - tl.x,
      bl.y - tl.y
    );


  /*
   * QR角度
   */

  const angle =
    Math.atan2(
      tr.y - tl.y,
      tr.x - tl.x
    );


  /*
   * 画面表示用スケール
   *
   * object-fit:coverに合わせる
   */

  const display =
    getVideoDisplayInfo();


  /*
   * AR位置
   */

  const screenX =
    display.offsetX +
    cx * display.scale;


  const screenY =
    display.offsetY +
    (
      cy -
      qh * AR_OFFSET_Y_SCALE
    ) * display.scale;


  /*
   * ARサイズ
   */

  const screenWidth =
    qw *
    AR_WIDTH_SCALE *
    display.scale;


  /*
   * AR画像表示
   */

  arImage.style.display =
    "block";


  arImage.style.width =
    screenWidth + "px";


  arImage.style.left =
    screenX + "px";


  arImage.style.top =
    screenY + "px";


  arImage.style.transform =
    "translate(-50%,-50%) rotate(" +
    angle * 180 / Math.PI +
    "deg)";


  /*
   * 撮影用に情報保存
   */

  currentAR = {

    cx:cx,

    cy:cy,

    qw:qw,

    qh:qh,

    angle:angle

  };


  /*
   * メッセージ
   */

  msg.textContent =
    "AR表示中";


  /*
   * 撮影ボタン
   */

  captureButton.style.display =
    "block";

}


/* ==================================================
   AR非表示
================================================== */

function hideAR(){

  arImage.style.display =
    "none";


  currentAR =
    null;


  captureButton.style.display =
    "none";


  saveButton.style.display =
    "none";


  msg.textContent =
    "QRコードを探しています…";

}


/* ==================================================
   object-fit:cover の表示情報
================================================== */

function getVideoDisplayInfo(){

  /*
   * カメラ映像の実サイズ
   */

  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  /*
   * 画面サイズ
   */

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  /*
   * object-fit:coverでは
   * 大きい方の倍率を使う
   */

  const scale =
    Math.max(
      screenWidth / videoWidth,
      screenHeight / videoHeight
    );


  /*
   * 実際に画面へ表示されるサイズ
   */

  const displayWidth =
    videoWidth * scale;

  const displayHeight =
    videoHeight * scale;


  /*
   * 中央配置による余白
   *
   * object-fit:coverでは
   * はみ出した部分が切り取られる
   */

  const offsetX =
    (
      screenWidth -
      displayWidth
    ) / 2;


  const offsetY =
    (
      screenHeight -
      displayHeight
    ) / 2;


  return {

    scale:scale,

    offsetX:offsetX,

    offsetY:offsetY

  };

}


/* ==================================================
   撮影
================================================== */

captureButton.onclick =
  function(){


    /*
     * QR未認識
     */

    if(!currentAR){

      msg.textContent =
        "QRコードを認識してください";

      return;

    }


    /*
     * AR画像未読み込み
     */

    if(
      !arImageReady ||
      !arImage.complete ||
      arImage.naturalWidth <= 0 ||
      arImage.naturalHeight <= 0
    ){

      msg.textContent =
        "AR画像を読み込んでいます…";

      return;

    }


    /*
     * カメラ映像サイズ
     */

    const videoWidth =
      video.videoWidth;

    const videoHeight =
      video.videoHeight;


    if(
      videoWidth <= 0 ||
      videoHeight <= 0
    ){

      msg.textContent =
        "カメラ映像を取得できません";

      return;

    }


    /*
     * 撮影Canvasを
     * カメラ映像と同じサイズにする
     */

    photoCanvas.width =
      videoWidth;

    photoCanvas.height =
      videoHeight;


    /*
     * Canvasをクリア
     */

    photoCtx.clearRect(
      0,
      0,
      videoWidth,
      videoHeight
    );


    /*
     * カメラ映像を描画
     */

    photoCtx.drawImage(
      video,
      0,
      0,
      videoWidth,
      videoHeight
    );


    /*
     * 現在のAR情報
     */

    const ar =
      currentAR;


    /*
     * AR画像の幅
     */

    const arWidth =
      ar.qw *
      AR_WIDTH_SCALE;


    /*
     * 元画像の比率から高さを計算
     */

    const arHeight =
      arWidth *
      (
        arImage.naturalHeight /
        arImage.naturalWidth
      );


    /*
     * AR画像の中心位置
     *
     * 画面表示と同じく
     * QR中心から上方向へ移動
     */

    const arX =
      ar.cx;


    const arY =
      ar.cy -
      ar.qh *
      AR_OFFSET_Y_SCALE;


    /*
     * AR画像をCanvasへ描画
     */

    photoCtx.save();


    /*
     * AR画像中心へ移動
     */

    photoCtx.translate(
      arX,
      arY
    );


    /*
     * QRと同じ角度へ回転
     */

    photoCtx.rotate(
      ar.angle
    );


    /*
     * 画像を中心基準で描画
     */

    photoCtx.drawImage(
      arImage,

      -arWidth / 2,
      -arHeight / 2,

      arWidth,
      arHeight
    );


    photoCtx.restore();


    /*
     * 撮影フラッシュ
     */

    flash.style.opacity =
      "1";


    setTimeout(
      function(){

        flash.style.opacity =
          "0";

      },
      100
    );


    /*
     * JPEG化
     */

    photoCanvas.toBlob(

      function(blob){

        if(!blob){

          msg.textContent =
            "写真を作成できませんでした";

          return;

        }


        /*
         * 以前のURLを解放
         */

        if(
          saveButton.dataset.url
        ){

          URL.revokeObjectURL(
            saveButton.dataset.url
          );

        }


        /*
         * Blob URL作成
         */

        const url =
          URL.createObjectURL(
            blob
          );


        /*
         * 保存リンク
         */

        saveButton.href =
          url;


        saveButton.dataset.url =
          url;


        /*
         * ファイル名
         */

        const now =
          new Date();


        const filename =
          "otokkky_AR_" +

          now.getFullYear() +

          String(
            now.getMonth()+1
          ).padStart(2,"0") +

          String(
            now.getDate()
          ).padStart(2,"0") +

          "_" +

          String(
            now.getHours()
          ).padStart(2,"0") +

          String(
            now.getMinutes()
          ).padStart(2,"0") +

          String(
            now.getSeconds()
          ).padStart(2,"0") +

          ".jpg";


        saveButton.download =
          filename;


        /*
         * 保存ボタン表示
         */

        saveButton.style.display =
          "block";


        msg.textContent =
          "撮影しました！";


      },

      "image/jpeg",

      JPEG_QUALITY

    );

  };


/* ==================================================
   画面サイズ変更
================================================== */

window.addEventListener(
  "resize",
  function(){

    /*
     * QR認識中なら
     * 次のフレームで自動的に
     * AR位置を更新
     */

  }
);


/* ==================================================
   ページ終了時
================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(stream){

      stream.getTracks().forEach(
        function(track){

          track.stop();

        }
      );

    }


    if(
      saveButton.dataset.url
    ){

      URL.revokeObjectURL(
        saveButton.dataset.url
      );

    }

  }
);

</script>

</body>
</html>

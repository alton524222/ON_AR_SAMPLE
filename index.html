<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>おとっきー AR</title>

<style>

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:sans-serif;
}

#video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#canvas{
  display:none;
}

#arImage{
  position:fixed;
  display:none;
  pointer-events:none;
  z-index:5;
  transform-origin:center center;
}

#msg{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;

  color:#fff;
  background:#000b;

  padding:9px 14px;

  border-radius:20px;

  font-size:14px;

  white-space:nowrap;
}

#capture{
  position:fixed;
  z-index:20;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  width:70px;
  height:70px;

  border-radius:50%;

  border:5px solid white;

  background:#222;

  display:none;
}

#save{
  position:fixed;
  z-index:20;

  left:50%;
  bottom:110px;

  transform:translateX(-50%);

  display:none;

  padding:12px 20px;

  border-radius:20px;

  background:white;

  color:#111;

  text-decoration:none;

  font-weight:bold;
}

#flash{
  position:fixed;
  inset:0;

  z-index:100;

  background:white;

  opacity:0;

  pointer-events:none;
}

</style>

</head>


<body>


<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<canvas id="canvas"></canvas>


<img
  id="arImage"
  src=""
  alt=""
>


<div id="msg">
  QRコードをカメラに映してください
</div>


<button
  id="capture"
>
  ●
</button>


<a
  id="save"
  download="AR_photo.jpg"
>
  写真を保存
</a>


<div id="flash"></div>


<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<script>

/* ==================================================
   DOM
================================================== */

const v =
  document.getElementById("video");

const c =
  document.getElementById("canvas");

const x =
  c.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const im =
  document.getElementById("arImage");

const m =
  document.getElementById("msg");

const capture =
  document.getElementById("capture");

const save =
  document.getElementById("save");

const flash =
  document.getElementById("flash");


/* ==================================================
   QRコード → 画像
================================================== */

const AR_IMAGES = {

  "OTOKKY_AR_001":
    "otokkky.png",

  "HZK＿AR":
    "HZK.PNG"

};


/* ==================================================
   現在のAR
================================================== */

let currentQR = "";

let currentLocation = null;


/* ==================================================
   カメラ開始
================================================== */

async function start(){

  try{

    const s =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    v.srcObject =
      s;

    await v.play();


    m.textContent =
      "QRコードを探しています…";


    requestAnimationFrame(
      scan
    );


  }catch(e){

    console.error(e);

    m.textContent =
      "カメラを使用できません。HTTPS接続とカメラ許可を確認してください。";

  }

}


/* ==================================================
   QRスキャン
================================================== */

function scan(){

  if(
    v.readyState >= 2 &&
    v.videoWidth > 0
  ){

    /*
     * 元のコードと同じく
     * 1920px基準
     */

    const w =
      1920;

    const h =
      Math.round(
        w *
        v.videoHeight /
        v.videoWidth
      );


    c.width =
      w;

    c.height =
      h;


    x.drawImage(
      v,
      0,
      0,
      w,
      h
    );


    const d =
      x.getImageData(
        0,
        0,
        w,
        h
      );


    const q =
      jsQR(
        d.data,
        w,
        h,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    /* ==============================================
       QR認識
    ============================================== */

    if(
      q &&
      q.location
    ){

      /*
       * QRデータに登録されている画像
       */

      const imageFile =
        AR_IMAGES[q.data];


      /*
       * 登録されているQRの場合
       */

      if(imageFile){

        currentQR =
          q.data;

        currentLocation =
          q.location;


        /*
         * ★ここが重要
         *
         * QRに応じて画像を変更
         */

        if(
          im.getAttribute("src")
          !== imageFile
        ){

          im.src =
            imageFile;

        }


        /*
         * AR位置計算
         */

        positionAR(
          q.location
        );


        /*
         * 表示
         */

        im.style.display =
          "block";


        /*
         * メッセージ
         */

        if(
          q.data ===
          "OTOKKY_AR_001"
        ){

          m.textContent =
            "おとっきーAR表示中";

        }else if(
          q.data ===
          "HZK＿AR"
        ){

          m.textContent =
            "HZK AR表示中";

        }


        /*
         * 撮影ボタン
         */

        capture.style.display =
          "block";


      }else{

        /*
         * 未登録QR
         */

        hideAR();

      }


    }else{

      /*
       * QRなし
       */

      hideAR();

    }

  }


  requestAnimationFrame(
    scan
  );

}


/* ==================================================
   AR位置
================================================== */

function positionAR(loc){

  const tl =
    loc.topLeftCorner;

  const tr =
    loc.topRightCorner;

  const bl =
    loc.bottomLeftCorner;

  const br =
    loc.bottomRightCorner;


  /*
   * QR中心
   */

  const cx =
    (
      tl.x +
      tr.x +
      bl.x +
      br.x
    ) / 4;


  const cy =
    (
      tl.y +
      tr.y +
      bl.y +
      br.y
    ) / 4;


  /*
   * QR幅
   */

  const qw =
    Math.hypot(
      tr.x - tl.x,
      tr.y - tl.y
    );


  /*
   * QR高さ
   */

  const qh =
    Math.hypot(
      bl.x - tl.x,
      bl.y - tl.y
    );


  /*
   * QR角度
   */

  const ang =
    Math.atan2(
      tr.y - tl.y,
      tr.x - tl.x
    ) *
    180 /
    Math.PI;


  /*
   * 画面倍率
   */

  const sx =
    innerWidth / 1920;

  const sy =
    innerHeight /
    c.height;


  /*
   * AR表示
   *
   * 元のコードと同じ位置関係
   */

  im.style.width =
    (
      qw *
      sx *
      8
    ) + "px";


  im.style.left =
    (
      cx *
      sx
    ) + "px";


  im.style.top =
    (
      cy *
      sy -
      qh *
      6 *
      sy
    ) + "px";


  im.style.transform =
    "translate(-50%,-50%) rotate(" +
    ang +
    "deg)";

}


/* ==================================================
   AR非表示
================================================== */

function hideAR(){

  im.style.display =
    "none";

  capture.style.display =
    "none";

  save.style.display =
    "none";

  currentQR =
    "";

  currentLocation =
    null;

}


/* ==================================================
   撮影
================================================== */

capture.onclick =
  function(){

    if(
      !currentLocation ||
      !currentQR
    ){

      return;

    }


    /*
     * 撮影Canvas
     */

    const photo =
      document.createElement(
        "canvas"
      );

    const pc =
      photo.getContext("2d");


    const w =
      v.videoWidth;

    const h =
      v.videoHeight;


    photo.width =
      w;

    photo.height =
      h;


    /*
     * カメラ映像
     */

    pc.drawImage(
      v,
      0,
      0,
      w,
      h
    );


    /*
     * QR位置
     */

    const loc =
      currentLocation;


    const tl =
      loc.topLeftCorner;

    const tr =
      loc.topRightCorner;

    const bl =
      loc.bottomLeftCorner;


    const cx =
      (
        tl.x +
        tr.x +
        bl.x +
        loc.bottomRightCorner.x
      ) / 4;


    const cy =
      (
        tl.y +
        tr.y +
        bl.y +
        loc.bottomRightCorner.y
      ) / 4;


    const qw =
      Math.hypot(
        tr.x - tl.x,
        tr.y - tl.y
      );


    const qh =
      Math.hypot(
        bl.x - tl.x,
        bl.y - tl.y
      );


    const angle =
      Math.atan2(
        tr.y - tl.y,
        tr.x - tl.x
      );


    /*
     * AR画像サイズ
     */

    const arWidth =
      qw * 8;

    const arHeight =
      arWidth *
      im.naturalHeight /
      im.naturalWidth;


    /*
     * AR位置
     */

    const arX =
      cx;

    const arY =
      cy -
      qh * 6;


    /*
     * 合成
     */

    pc.save();


    pc.translate(
      arX,
      arY
    );


    pc.rotate(
      angle
    );


    pc.drawImage(

      im,

      -arWidth / 2,

      -arHeight / 2,

      arWidth,

      arHeight

    );


    pc.restore();


    /*
     * フラッシュ
     */

    flash.style.opacity =
      "1";


    setTimeout(
      function(){

        flash.style.opacity =
          "0";

      },
      100
    );


    /*
     * 保存
     */

    photo.toBlob(

      function(blob){

        const url =
          URL.createObjectURL(
            blob
          );


        save.href =
          url;


        save.download =
          "AR_" +
          currentQR +
          ".jpg";


        save.style.display =
          "block";


        m.textContent =
          "撮影しました！";


      },

      "image/jpeg",

      0.95

    );

  };


/* ==================================================
   画像読み込み確認
================================================== */

im.onload =
  function(){

    console.log(
      "画像読み込み成功:",
      im.src
    );

  };


im.onerror =
  function(){

    console.error(
      "画像読み込み失敗:",
      im.src
    );

    m.textContent =
      "AR画像を読み込めません：" +
      im.src;

  };


/* ==================================================
   開始
================================================== */

start();

</script>

</body>
</html>

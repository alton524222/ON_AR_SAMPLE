<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>ARフォトフレーム</title>

<style>

/* ==================================================
   全体
================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:sans-serif;
}


/* ==================================================
   カメラ
================================================== */

#video{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}


/* ==================================================
   Canvas
================================================== */

#scanCanvas,
#photoCanvas{
  display:none;
}


/* ==================================================
   AR画像
================================================== */

#arImage{
  position:fixed;
  display:none;
  z-index:5;
  pointer-events:none;
  transform-origin:center center;
  user-select:none;
  -webkit-user-drag:none;
}


/* ==================================================
   メッセージ
================================================== */

#msg{
  position:fixed;
  z-index:20;
  top:14px;
  left:50%;

  transform:translateX(-50%);

  color:#fff;
  background:rgba(0,0,0,.75);

  padding:9px 16px;

  border-radius:20px;

  font-size:14px;

  white-space:nowrap;

  text-align:center;
}


/* ==================================================
   撮影ボタン
================================================== */

#capture{

  position:fixed;

  z-index:30;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  width:78px;
  height:78px;

  border-radius:50%;

  border:6px solid #fff;

  background:#fff;

  box-shadow:
    0 2px 12px rgba(0,0,0,.6);

  display:none;

  padding:0;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}


#capture::after{

  content:"";

  position:absolute;

  left:50%;
  top:50%;

  width:58px;
  height:58px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#222;

}


/* ==================================================
   保存ボタン
================================================== */

#save{

  position:fixed;

  z-index:30;

  left:50%;

  bottom:125px;

  transform:translateX(-50%);

  display:none;

  padding:12px 22px;

  border-radius:22px;

  background:#fff;

  color:#111;

  text-decoration:none;

  font-size:15px;

  font-weight:bold;

  box-shadow:
    0 2px 12px rgba(0,0,0,.6);

  white-space:nowrap;
}


/* ==================================================
   フラッシュ
================================================== */

#flash{

  position:fixed;

  inset:0;

  z-index:100;

  background:#fff;

  opacity:0;

  pointer-events:none;

}


/* ==================================================
   開始ボタン
================================================== */

#start{

  position:fixed;

  z-index:40;

  left:50%;

  bottom:30px;

  transform:translateX(-50%);

  padding:15px 28px;

  border:0;

  border-radius:25px;

  background:#fff;

  color:#111;

  font-size:16px;

  font-weight:bold;

  box-shadow:
    0 2px 12px rgba(0,0,0,.6);
}

</style>

</head>


<body>


<!-- ==================================================
     カメラ
================================================== -->

<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<!-- ==================================================
     QR認識用Canvas
================================================== -->

<canvas id="scanCanvas"></canvas>


<!-- ==================================================
     撮影用Canvas
================================================== -->

<canvas id="photoCanvas"></canvas>


<!-- ==================================================
     AR画像
================================================== -->

<img
  id="arImage"
  src=""
  alt=""
>


<!-- ==================================================
     メッセージ
================================================== -->

<div id="msg">
  カメラを開始してください
</div>


<!-- ==================================================
     カメラ開始
================================================== -->

<button id="start">
  カメラを開始
</button>


<!-- ==================================================
     撮影
================================================== -->

<button
  id="capture"
  aria-label="撮影"
></button>


<!-- ==================================================
     保存
================================================== -->

<a
  id="save"
  download="AR_photo.jpg"
>
  写真を保存
</a>


<!-- ==================================================
     フラッシュ
================================================== -->

<div id="flash"></div>


<!-- ==================================================
     jsQR
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<script>

/* ==================================================
   DOM
================================================== */

const video =
  document.getElementById("video");

const scanCanvas =
  document.getElementById("scanCanvas");

const scanCtx =
  scanCanvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const photoCanvas =
  document.getElementById("photoCanvas");

const photoCtx =
  photoCanvas.getContext("2d");

const arImage =
  document.getElementById("arImage");

const msg =
  document.getElementById("msg");

const startButton =
  document.getElementById("start");

const captureButton =
  document.getElementById("capture");

const saveButton =
  document.getElementById("save");

const flash =
  document.getElementById("flash");


/* ==================================================
   QRコード → AR画像 対応表
================================================== */

const AR_IMAGES = {

  /*
   * おとっきー
   */
  "OTOKKY_AR_001":
    "otokkky.png",


  /*
   * HZK
   *
   * 「＿」は全角アンダーバー
   */
  "HZK＿AR":
    "HZK.PNG"

};


/* ==================================================
   AR設定
================================================== */


/*
 * AR画像の横幅
 *
 * QRコードの幅 × 8
 */

const AR_WIDTH_SCALE =
  8;


/*
 * AR画像の位置
 *
 * QRコードの高さ × 6 上方向
 */

const AR_OFFSET_Y_SCALE =
  6;


/*
 * JPEG品質
 */

const JPEG_QUALITY =
  0.95;


/* ==================================================
   状態
================================================== */

let stream = null;

let running = false;


/*
 * 現在のAR情報
 *
 * カメラ映像座標で保持する
 */

let currentAR = null;


/*
 * 現在読み込んでいる画像
 */

let currentImageSrc = "";


/*
 * AR画像読み込み完了
 */

let arImageReady = false;


/* ==================================================
   AR画像読み込み完了
================================================== */

arImage.onload =
  function(){

    arImageReady = true;


    console.log(
      "AR画像読み込み完了:",
      arImage.src
    );


    /*
     * QR認識済みなら
     * 読み込み完了後に再表示
     */

    if(currentAR){

      renderAROnScreen();

    }

  };


/* ==================================================
   AR画像読み込み失敗
================================================== */

arImage.onerror =
  function(){

    arImageReady = false;

    console.error(
      "AR画像を読み込めません:",
      arImage.src
    );

  };


/* ==================================================
   AR画像変更
================================================== */

function loadARImage(src){

  /*
   * すでに同じ画像なら
   * 再読み込みしない
   */

  if(currentImageSrc === src){

    /*
     * キャッシュ済みの場合
     */

    if(
      arImage.complete &&
      arImage.naturalWidth > 0
    ){

      arImageReady = true;

      if(currentAR){

        renderAROnScreen();

      }

    }

    return;

  }


  /*
   * 新しい画像なので
   * 一旦非表示
   */

  arImageReady = false;

  arImage.style.display =
    "none";


  currentImageSrc =
    src;


  /*
   * 画像読み込み
   */

  arImage.src =
    src;

}


/* ==================================================
   カメラ開始
================================================== */

startButton.onclick =
  async function(){

    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{

            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }

          },

          audio:false

        });


      video.srcObject =
        stream;


      await video.play();


      startButton.style.display =
        "none";


      msg.textContent =
        "QRコードを探しています…";


      running = true;


      requestAnimationFrame(
        scan
      );


    }catch(error){

      console.error(error);

      msg.textContent =
        "カメラを使用できません。HTTPS接続とカメラ許可を確認してください。";

    }

  };


/* ==================================================
   QR認識
================================================== */

function scan(){

  if(!running){

    return;

  }


  if(
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ){

    /*
     * カメラ映像の実解像度
     *
     * ここを全体の基準にする
     */

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    /*
     * QR認識Canvas
     */

    scanCanvas.width =
      w;

    scanCanvas.height =
      h;


    /*
     * カメラ映像をそのまま描画
     */

    scanCtx.drawImage(
      video,
      0,
      0,
      w,
      h
    );


    /*
     * ピクセル取得
     */

    const imageData =
      scanCtx.getImageData(
        0,
        0,
        w,
        h
      );


    /*
     * QRコード認識
     */

    const qr =
      jsQR(
        imageData.data,
        w,
        h,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    /*
     * QRが見つかった
     */

    if(
      qr &&
      qr.location
    ){

      /*
       * QRデータに対応する画像
       */

      const imageSrc =
        AR_IMAGES[qr.data];


      /*
       * 登録済みQR
       */

      if(imageSrc){

        /*
         * 画像を選択
         */

        loadARImage(
          imageSrc
        );


        /*
         * AR位置更新
         */

        updateAR(
          qr.location
        );


        /*
         * メッセージ
         */

        if(
          qr.data ===
          "OTOKKY_AR_001"
        ){

          msg.textContent =
            "おとっきー AR表示中";

        }else if(
          qr.data ===
          "HZK＿AR"
        ){

          msg.textContent =
            "HZK AR表示中";

        }


      }else{

        /*
         * 登録されていないQR
         */

        hideAR();

      }


    }else{

      /*
       * QRなし
       */

      hideAR();

    }

  }


  /*
   * 次のフレーム
   */

  requestAnimationFrame(
    scan
  );

}


/* ==================================================
   AR位置計算
================================================== */

function updateAR(location){

  /*
   * QR四隅
   */

  const tl =
    location.topLeftCorner;

  const tr =
    location.topRightCorner;

  const bl =
    location.bottomLeftCorner;

  const br =
    location.bottomRightCorner;


  /*
   * QR中心
   */

  const cx =
    (
      tl.x +
      tr.x +
      bl.x +
      br.x
    ) / 4;


  const cy =
    (
      tl.y +
      tr.y +
      bl.y +
      br.y
    ) / 4;


  /*
   * QR幅
   */

  const qw =
    Math.hypot(
      tr.x - tl.x,
      tr.y - tl.y
    );


  /*
   * QR高さ
   */

  const qh =
    Math.hypot(
      bl.x - tl.x,
      bl.y - tl.y
    );


  /*
   * QR角度
   */

  const angle =
    Math.atan2(
      tr.y - tl.y,
      tr.x - tl.x
    );


  /*
   * AR中心
   */

  const arX =
    cx;


  const arY =
    cy -
    qh * AR_OFFSET_Y_SCALE;


  /*
   * AR情報
   *
   * カメラ映像座標で保存
   */

  currentAR = {

    x:arX,

    y:arY,

    width:
      qw * AR_WIDTH_SCALE,

    angle:angle,

    cameraWidth:
      video.videoWidth,

    cameraHeight:
      video.videoHeight

  };


  /*
   * 画面表示
   */

  renderAROnScreen();


  /*
   * 撮影ボタン
   */

  captureButton.style.display =
    "block";

}


/* ==================================================
   画面上のAR表示
================================================== */

function renderAROnScreen(){

  if(!currentAR){

    return;

  }


  /*
   * 画像読み込み待ち
   */

  if(
    !arImageReady ||
    arImage.naturalWidth <= 0
  ){

    arImage.style.display =
      "none";

    return;

  }


  /*
   * カメラ映像サイズ
   */

  const vw =
    currentAR.cameraWidth;

  const vh =
    currentAR.cameraHeight;


  /*
   * 画面サイズ
   */

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  /*
   * videoの
   * object-fit:cover
   * と同じ計算
   */

  const scale =
    Math.max(
      sw / vw,
      sh / vh
    );


  /*
   * 表示されるカメラ映像サイズ
   */

  const displayWidth =
    vw * scale;

  const displayHeight =
    vh * scale;


  /*
   * 中央配置
   */

  const offsetX =
    (
      sw -
      displayWidth
    ) / 2;


  const offsetY =
    (
      sh -
      displayHeight
    ) / 2;


  /*
   * カメラ座標
   * ↓
   * 画面座標
   */

  const screenX =
    offsetX +
    currentAR.x *
    scale;


  const screenY =
    offsetY +
    currentAR.y *
    scale;


  /*
   * AR画像サイズ
   */

  const screenWidth =
    currentAR.width *
    scale;


  const aspect =
    arImage.naturalHeight /
    arImage.naturalWidth;


  const screenHeight =
    screenWidth *
    aspect;


  /*
   * 表示
   */

  arImage.style.display =
    "block";


  arImage.style.width =
    screenWidth + "px";


  arImage.style.height =
    screenHeight + "px";


  arImage.style.left =
    screenX + "px";


  arImage.style.top =
    screenY + "px";


  arImage.style.transform =
    "translate(-50%,-50%) rotate(" +
    (
      currentAR.angle *
      180 /
      Math.PI
    ) +
    "deg)";

}


/* ==================================================
   AR非表示
================================================== */

function hideAR(){

  arImage.style.display =
    "none";

  currentAR =
    null;

  captureButton.style.display =
    "none";

  saveButton.style.display =
    "none";

}


/* ==================================================
   画面サイズ変更
================================================== */

window.addEventListener(
  "resize",
  function(){

    if(currentAR){

      renderAROnScreen();

    }

  }
);


/* ==================================================
   撮影
================================================== */

captureButton.onclick =
  function(){

    /*
     * AR確認
     */

    if(!currentAR){

      msg.textContent =
        "QRコードを認識してください";

      return;

    }


    /*
     * 画像確認
     */

    if(
      !arImageReady ||
      !arImage.complete ||
      arImage.naturalWidth <= 0
    ){

      msg.textContent =
        "AR画像を読み込んでいます…";

      return;

    }


    /*
     * カメラ映像サイズ
     */

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    /*
     * 撮影Canvas
     */

    photoCanvas.width =
      w;

    photoCanvas.height =
      h;


    /*
     * カメラ映像をそのまま描画
     */

    photoCtx.clearRect(
      0,
      0,
      w,
      h
    );


    photoCtx.drawImage(
      video,
      0,
      0,
      w,
      h
    );


    /*
     * AR画像高さ
     */

    const arHeight =
      currentAR.width *
      (
        arImage.naturalHeight /
        arImage.naturalWidth
      );


    /*
     * AR画像合成
     *
     * currentARは
     * カメラ映像座標なので、
     * 画面のobject-fit:coverを
     * ここでは考慮しない
     */

    photoCtx.save();


    photoCtx.translate(
      currentAR.x,
      currentAR.y
    );


    photoCtx.rotate(
      currentAR.angle
    );


    photoCtx.drawImage(

      arImage,

      -currentAR.width / 2,

      -arHeight / 2,

      currentAR.width,

      arHeight

    );


    photoCtx.restore();


    /*
     * フラッシュ
     */

    flash.style.opacity =
      "1";


    setTimeout(
      function(){

        flash.style.opacity =
          "0";

      },
      100
    );


    /*
     * JPEG作成
     */

    photoCanvas.toBlob(

      function(blob){

        if(!blob){

          msg.textContent =
            "写真を作成できませんでした";

          return;

        }


        /*
         * 古いURLを解放
         */

        if(
          saveButton.dataset.url
        ){

          URL.revokeObjectURL(
            saveButton.dataset.url
          );

        }


        /*
         * 保存用URL
         */

        const url =
          URL.createObjectURL(
            blob
          );


        saveButton.href =
          url;


        saveButton.dataset.url =
          url;


        /*
         * ファイル名
         */

        const now =
          new Date();


        const filename =
          "AR_" +

          now.getFullYear() +

          String(
            now.getMonth()+1
          ).padStart(2,"0") +

          String(
            now.getDate()
          ).padStart(2,"0") +

          "_" +

          String(
            now.getHours()
          ).padStart(2,"0") +

          String(
            now.getMinutes()
          ).padStart(2,"0") +

          String(
            now.getSeconds()
          ).padStart(2,"0") +

          ".jpg";


        saveButton.download =
          filename;


        /*
         * 保存ボタン表示
         */

        saveButton.style.display =
          "block";


        msg.textContent =
          "撮影しました！";

      },

      "image/jpeg",

      JPEG_QUALITY

    );

  };


/* ==================================================
   終了処理
================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(stream){

      stream
        .getTracks()
        .forEach(
          function(track){

            track.stop();

          }
        );

    }


    if(
      saveButton.dataset.url
    ){

      URL.revokeObjectURL(
        saveButton.dataset.url
      );

    }

  }
);

</script>

</body>
</html>
